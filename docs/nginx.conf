# YeniMenzil.az Production Reverse Proxy Configuration
# -----------------------------------------------------
# This Nginx configuration sits in front of the Docker container network
# and provides:
# - SSL/TLS termination (certificates should be placed in /etc/nginx/certs)
# - Security headers (HSTS, X-Frame-Options, X-Content-Type-Options, etc.)
# - Request rate limiting
# - HTTP/2 support
# - Redirect from www to non-www
# - API and web routing to Docker services
#
# To use:
# 1. Place SSL certificates as api.yenimenzil.az.crt and api.yenimenzil.az.key
#    in /etc/nginx/certs/
# 2. Run: docker run -d -p 80:80 -p 443:443 \
#       -v /etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
#       -v /etc/nginx/certs:/etc/nginx/certs:ro \
#       -v /etc/nginx/vhost.d:/etc/nginx/vhost.d:ro \
#       -v /usr/share/nginx/html:/usr/share/nginx/html:ro \
#       --name nginx-proxy nginx:alpine
# 3. Or integrate into your existing Docker infrastructure

# Master config
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

# Events module
events {
    worker_connections 1024;
    use epoll;
}

# HTTP stream module (for TCP/UDP proxying if needed)
stream {
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream web_backend {
        server web:3000;
        keepalive 32;
    }

    # Redis exporter metrics
    upstream redis_exporter_backend {
        server redis-exporter:9121;
    }

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=web_limit:10m rate=20r/s;

    server {
        # API proxy with rate limiting
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        ssl_certificate /etc/nginx/certs/api.yenimenzil.az.crt;
        ssl_certificate_key /etc/nginx/certs/api.yenimenzil.az.key;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "none" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    server {
        # Web (Next.js) proxy with rate limiting
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        ssl_certificate /etc/nginx/certs/api.yenimenzil.az.crt;
        ssl_certificate_key /etc/nginx/certs/api.yenimenzil.az.key;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "none" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Rate limiting
        limit_req zone=web_limit burst=40 nodelay;

        proxy_pass http://web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name api.yenimenzil.az www.yenimenzil.az;

        # Force HTTPS with HSTS
        return 301 https://$host$request_uri;
    }
}

# Stream proxies (TCP level for raw TCP connections if needed)
stream {
    upstream api_tcp {
        server api:8000;
        keepalive 32;
    }

    upstream web_tcp {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 443;
        listen [::]:443;
        proxy_pass http://api_tcp;
    }
}