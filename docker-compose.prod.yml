name: yenimenzil-prod

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  yenimenzil_pg_data:
  yenimenzil_redis_data:
  yenimenzil_minio_data:
  caddy_data:

services:
  caddy:
    image: caddy:latest
    container_name: yenimenzil-caddy
    restart: unless-stopped
    networks:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-yenimenzil.az}

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: yenimenzil-migrate
    restart: "no"
    networks:
      - backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://yenimenzil:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/yenimenzil
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head

  db:
    image: postgis/postgis:16-3.4
    container_name: yenimenzil-db
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - yenimenzil_pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=yenimenzil
      - POSTGRES_USER=yenimenzil
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yenimenzil"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yenimenzil-redis
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - yenimenzil_redis_data:/data
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: yenimenzil-minio
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - yenimenzil_minio_data:/data
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: yenimenzil-api
    restart: unless-stopped
    networks:
      - frontend
      - backend
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://yenimenzil:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/yenimenzil
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-https://yenimenzil.az}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - COOKIE_SECURE=true
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://yenimenzil.az}
      - S3_ENDPOINT=minio:9000
      - S3_BUCKET=yenimenzil-media
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-https://yenimenzil.az/media}
      - S3_SECURE=false
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-manual}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://yenimenzil.az/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://yenimenzil.az}
    container_name: yenimenzil-web
    restart: unless-stopped
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    container_name: yenimenzil-worker
    restart: unless-stopped
    networks:
      - backend
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://yenimenzil:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/yenimenzil
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - S3_ENDPOINT=minio:9000
      - S3_BUCKET=yenimenzil-media
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-https://yenimenzil.az/media}
      - S3_SECURE=false
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-manual}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
